    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: #0b1a36;
      font-family: "Segoe UI", "Helvetica Neue", "Helvetica", sans-serif;
      color: #f4f0d6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 18px;
      gap: 14px;
    }

    .stage {
      width: min(1200px, 100vw);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 50px rgba(0,0,0,0.35);
      background: #0b1a36;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .panel {
      width: min(1200px, 100vw);
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-radius: 16px;
      background: rgba(12, 20, 34, 0.78);
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .panel label {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: #dbe6f0;
    }

    .panel input[type="range"] {
      width: 180px;
      accent-color: #ffd36b;
    }

    .panel button,
    .panel select {
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #f4f0d6;
      font-size: 13px;
      cursor: pointer;
    }

    .panel button:hover,
    .panel select:hover {
      background: rgba(255,255,255,0.16);
    }

    .telemetry {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 13px;
      letter-spacing: 0.03em;
    }

    .telemetry strong {
      color: #ffd36b;
    }

    .hint {
      font-size: 12px;
      color: #a7b8c9;
    }

    .control-panel {
      width: min(1200px, 100vw);
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 14px 20px;
      border-radius: 16px;
      background: rgba(12, 20, 34, 0.82);
      box-shadow: 0 8px 24px rgba(0,0,0,0.28);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.14);
    }

    .panel-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.03em;
      color: #ffd36b;
    }

    .control-row, .theme-row, .telemetry-badge {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .control-panel label {
      font-size: 13px;
      color: #dbe6f0;
    }

    .control-panel input[type="range"] {
      width: 160px;
      accent-color: #ffd36b;
      cursor: pointer;
    }

    .control-panel button {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.08);
      color: #f4f0d6;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .control-panel button:hover {
      background: rgba(255,255,255,0.18);
    }

    .control-panel button.active {
      background: rgba(255, 211, 107, 0.22);
      border-color: #ffd36b;
      color: #ffd36b;
      font-weight: 600;
    }

    .telemetry-badge {
      padding: 7px 14px;
      border-radius: 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.14);
      font-size: 13px;
      gap: 16px;
    }

    .telemetry-badge strong {
      color: #ffd36b;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>

        <g id="wing">

        <!-- Head -->
        <g id="head">
          <path d="M520 390 Q530 345 570 335 Q610 325 630 350 Q645 370 630 395 Q610 410 580 405 Q545 400 520 390 Z" style="fill: var(--pelicanHead); stroke: var(--pelicanHeadDark); stroke-width: 3"/>
          <path d="M535 365 Q560 350 590 350 Q615 350 625 365" style="fill: none; stroke: var(--pelicanHeadLight); stroke-width: 3; opacity: 0.55"/>

        <!-- Eye -->
        <g id="eye">
          <circle cx="590" cy="365" r="10" style="fill: var(--eyeWhite); stroke: var(--eyeDark); stroke-width: 2"/>
          <circle cx="592" cy="365" r="5" style="fill: var(--eyePupil)"/>
          <circle cx="594" cy="363" r="2" style="fill: var(--eyeGlint); opacity: 0.9"/>
          <path id="eyeLid" d="M580 358 Q590 352 600 358" style="fill: none; stroke: var(--eyeDark); stroke-width: 2; opacity: 0.8"/>
        </g>

        <!-- Long hooked beak with nail tip -->
        <g id="beak">
          <path d="M625 370 Q660 365 690 375 Q710 385 705 400 Q700 415 680 420 Q660 425 640 415 Q625 405 625 390 Z" style="fill: var(--beakColor); stroke: var(--beakDark); stroke-width: 3"/>
          <path d="M625 370 Q650 370 675 380 Q690 390 690 400" style="fill: none; stroke: var(--beakLight); stroke-width: 3; opacity: 0.55"/>
          <path d="M690 375 Q705 370 715 380 Q720 390 710 398 Q700 405 690 400" style="fill: var(--beakNail); stroke: var(--beakDark); stroke-width: 2"/>
        </g>

        <!-- Elastic gular throat pouch -->
        <g id="pouch">
          <path d="M625 395 Q640 420 650 450 Q660 480 640 495 Q620 505 600 490 Q585 475 590 445 Q595 415 625 395 Z" style="fill: var(--pouchColor); stroke: var(--pouchDark); stroke-width: 3"/>
          <path d="M610 420 Q625 440 630 465 Q635 485 620 490" style="fill: none; stroke: var(--pouchLight); stroke-width: 3; opacity: 0.55"/>

        <!-- Back leg: 2-segment inverse kinematics -->
        <g id="legBack">
          <path id="legBackUpper" d="M470 470 L500 520" style="fill: none; stroke: var(--legColor); stroke-width: 8; stroke-linecap: round"/>

            <path d="M-12 0 Q0 -8 14 0 Q18 8 8 12 Q0 14 -8 10 Q-14 6 -12 0 Z" style="fill: var(--footColor); stroke: var(--footDark); stroke-width: 2"/>

        <!-- Front leg: 2-segment inverse kinematics -->
        <g id="legFront">
          <path id="legFrontUpper" d="M520 470 L545 520" style="fill: none; stroke: var(--legColor); stroke-width: 8; stroke-linecap: round"/>
          <path id="legFrontLower" d="M545 520 L540 475" style="fill: none; stroke: var(--legColor); stroke-width: 7; stroke-linecap: round"/>
          <g id="footFront" transform="translate(540,475)">
            <path d="M-12 0 Q0 -8 14 0 Q18 8 8 12 Q0 14 -8 10 Q-14 6 -12 0 Z" style="fill: var(--footColor); stroke: var(--footDark); stroke-width: 2"/>
            <path d="M-8 4 L-2 8 M2 4 L6 8 M8 4 L12 8" style="fill: none; stroke: var(--footDark); stroke-width: 1.5; opacity: 0.65"/>

      <g id="grass" style="fill: var(--grassColor); opacity: 0.8">
        <path d="M0 620 Q40 590 80 620 Q120 600 160 620 Q200 590 240 620 Q280 600 320 620 Q360 590 400 620 Q440 600 480 620 Q520 590 560 620 Q600 600 640 620 Q680 590 720 620 Q760 600 800 620 Q840 590 880 620 Q920 600 960 620 Q1000 590 1040 620 Q1080 600 1120 620 Q1160 590 1200 620 L1200 660 L0 660 Z"/>
      </g>

  <!-- Interactive control panel -->
  <div class="control-panel">
    <div class="panel-title">Pelican Bicycle Showcase</div>

    <div class="control-row">
      <label for="speedSlider">Speed</label>
      <input id="speedSlider" type="range" min="0.2" max="3.0" step="0.1" value="1.0"/>
      <span id="speedValue">1.0x</span>
    </div>

    <div class="control-row">
      <button id="playPauseBtn" type="button">Pause</button>
    </div>

    <div class="theme-row">
      <button id="sunnyBtn" type="button" class="theme-btn active">Sunny Coast</button>
      <button id="sunsetBtn" type="button" class="theme-btn">Golden Sunset</button>
      <button id="nightBtn" type="button" class="theme-btn">Starlight Night</button>
    </div>

    <div class="telemetry-badge">
      <span>RPM: <strong id="rpmValue">42</strong></span>
      <span>km/h: <strong id="kmhValue">18.5</strong></span>
    </div>
  </div>

  <script>
    (() => {
      const svg = document.querySelector("svg");
      const speedSlider = document.getElementById("speedSlider");
      const speedValue = document.getElementById("speedValue");
      const playPauseBtn = document.getElementById("playPauseBtn");
      const sunnyBtn = document.getElementById("sunnyBtn");
      const sunsetBtn = document.getElementById("sunsetBtn");
      const nightBtn = document.getElementById("nightBtn");
      const rpmValue = document.getElementById("rpmValue");
      const kmhValue = document.getElementById("kmhValue");

      const rearWheel = document.getElementById("rearWheel");
      const frontWheel = document.getElementById("frontWheel");
      const pedalBack = document.getElementById("pedalBack");
      const pedalFront = document.getElementById("pedalFront");
      const legBackUpper = document.getElementById("legBackUpper");
      const legBackLower = document.getElementById("legBackLower");
      const footBack = document.getElementById("footBack");
      const legFrontUpper = document.getElementById("legFrontUpper");
      const legFrontLower = document.getElementById("legFrontLower");
      const footFront = document.getElementById("footFront");
      const eyeLid = document.getElementById("eyeLid");
      const roadDashes = document.getElementById("roadDashes");
      const pouch = document.getElementById("pouch");
      const bodyGroup = document.getElementById("body");
      const headGroup = document.getElementById("head");
      const beakGroup = document.getElementById("beak");
      const eyeGroup = document.getElementById("eye");
      const wingGroup = document.getElementById("wing");
      const tailFeathers = document.getElementById("tailFeathers");
      const clouds = document.getElementById("clouds");
      const boardwalk = document.getElementById("boardwalk");

      const themes = {
        sunny: {
          "--skyTop": "#8ed8ff",
          "--skyBottom": "#f7dca8",
          "--sunColor": "#ffe27a",
          "--islandColor": "#7aa67a",
          "--lighthouseColor": "#f4f0e6",
          "--lighthouseLight": "#ffe9a8",
          "--boardwalkColor": "#b98b5a",
          "--boardwalkLine": "#8a5f38",
          "--boardwalkPlank": "#d8b17a",
          "--roadColor": "#4a4a4a",
          "--roadEdge": "#2f2f2f",
          "--roadDash": "#f2d36b",
          "--wheelTire": "#222222",
          "--wheelRim": "#c7c7c7",
          "--spokeColor": "#d9d9d9",
          "--hubColor": "#8a8a8a",
          "--frameColor": "#2e8f8f",
          "--chainRing": "#c7a34a",
          "--chainColor": "#6a6a6a",
          "--saddleColor": "#5b3b2a",
          "--handleGrip": "#333333",
          "--pedalColor": "#555555",
          "--pelicanFeather": "#f6f2e8",
          "--pelicanFeatherDark": "#c9c2b4",
          "--pelicanBody": "#f7f3e9",
          "--pelicanBodyDark": "#c9c2b4",
          "--pelicanBodyLight": "#ffffff",
          "--pelicanWing": "#e8e0d0",
          "--pelicanWingDark": "#b8ae9c",
          "--pelicanWingLight": "#ffffff",
          "--pelicanHead": "#f7f3e9",
          "--pelicanHeadDark": "#c9c2b4",
          "--pelicanHeadLight": "#ffffff",
          "--eyeWhite": "#ffffff",
          "--eyeDark": "#222222",
          "--eyePupil": "#111111",
          "--eyeGlint": "#ffffff",
          "--beakColor": "#e8a33a",
          "--beakDark": "#a56a1f",
          "--beakLight": "#ffd27a",
          "--beakNail": "#5a3a1a",
          "--pouchColor": "#f0b45a",
          "--pouchDark": "#b77a2a",
          "--pouchLight": "#ffd98a",
          "--legColor": "#e8a33a",
          "--footColor": "#e88a2a",
          "--footDark": "#a55a1a",
          "--grassColor": "#6f9a5a"
        },
        sunset: {
          "--skyTop": "#ff9a6a",
          "--skyBottom": "#ffd28a",
          "--sunColor": "#ffb35a",
          "--islandColor": "#6a7a5a",
          "--lighthouseColor": "#e8d8c0",
          "--lighthouseLight": "#ffb35a",
          "--boardwalkColor": "#8a5a3a",
          "--boardwalkLine": "#5a3a22",
          "--boardwalkPlank": "#b98a5a",
          "--roadColor": "#3a2a2a",
          "--roadEdge": "#221a1a",
          "--roadDash": "#ffb35a",
          "--wheelTire": "#1a1a1a",
          "--wheelRim": "#b8b8b8",
          "--spokeColor": "#c8c8c8",
          "--hubColor": "#7a7a7a",
          "--frameColor": "#d95b43",
          "--chainRing": "#b88a3a",
          "--chainColor": "#5a5a5a",
          "--saddleColor": "#4a2a1a",
          "--handleGrip": "#2a2a2a",
          "--pedalColor": "#4a4a4a",
          "--pelicanFeather": "#f0e8d8",
          "--pelicanFeatherDark": "#b8a890",
          "--pelicanBody": "#f0e8d8",
          "--pelicanBodyDark": "#b8a890",
          "--pelicanBodyLight": "#fff0e0",
          "--pelicanWing": "#d8c8b0",
          "--pelicanWingDark": "#a89078",
          "--pelicanWingLight": "#fff0e0",
          "--pelicanHead": "#f0e8d8",
          "--pelicanHeadDark": "#b8a890",
          "--pelicanHeadLight": "#fff0e0",
          "--eyeWhite": "#ffffff",
          "--eyeDark": "#222222",
          "--eyePupil": "#111111",
          "--eyeGlint": "#ffffff",
          "--beakColor": "#e8a040",
          "--beakDark": "#9a5c18",
          "--beakLight": "#ffd080",
          "--beakNail": "#4e3014",
          "--pouchColor": "#e79c4a",
          "--pouchDark": "#a86420",
          "--pouchLight": "#ffd080",
          "--legColor": "#e09032",
          "--footColor": "#df7a24",
          "--footDark": "#984a14",
          "--grassColor": "#587c48"
        },
        night: {
          "--skyTop": "#0b1a36",
          "--skyBottom": "#1e3766",
          "--sunColor": "#f4f0d6",
          "--islandColor": "#243f52",
          "--lighthouseColor": "#d6c6a6",
          "--lighthouseLight": "#ffe680",
          "--boardwalkColor": "#5e4330",
          "--boardwalkLine": "#3b281c",
          "--boardwalkPlank": "#7d5b42",
          "--roadColor": "#282c34",
          "--roadEdge": "#171a20",
          "--roadDash": "#c4b07b",
          "--wheelTire": "#12151a",
          "--wheelRim": "#9fb0c0",
          "--spokeColor": "#b0c0d0",
          "--hubColor": "#6c7c8c",
          "--frameColor": "#3aa6a6",
          "--chainRing": "#b5923b",
          "--chainColor": "#525c68",
          "--saddleColor": "#452a1d",
          "--handleGrip": "#1e2228",
          "--pedalColor": "#3c4450",
          "--pelicanFeather": "#d8d2c7",
          "--pelicanFeatherDark": "#9e9689",
          "--pelicanBody": "#dcd6cb",
          "--pelicanBodyDark": "#9e9689",
          "--pelicanBodyLight": "#f0ece4",
          "--pelicanWing": "#c8c0b4",
          "--pelicanWingDark": "#8e867a",
          "--pelicanWingLight": "#e6e0d6",
          "--pelicanHead": "#dcd6cb",
          "--pelicanHeadDark": "#9e9689",
          "--pelicanHeadLight": "#f0ece4",
          "--eyeWhite": "#e8e8e8",
          "--eyeDark": "#111111",
          "--eyePupil": "#050505",
          "--eyeGlint": "#ffffff",
          "--beakColor": "#cc8d32",
          "--beakDark": "#855316",
          "--beakLight": "#ebb865",
          "--beakNail": "#3d2610",
          "--pouchColor": "#d49a4a",
          "--pouchDark": "#8f5f1e",
          "--pouchLight": "#ebb865",
          "--legColor": "#c9852c",
          "--footColor": "#c47120",
          "--footDark": "#7d4110",
          "--grassColor": "#2e4f3e"
        }
      };

      function applyTheme(name) {
        const palette = themes[name] || themes.sunny;
        document.body.dataset.theme = name;
        for (const [key, val] of Object.entries(palette)) {
          document.documentElement.style.setProperty(key, val);
        }
        [sunnyBtn, sunsetBtn, nightBtn].forEach((btn) => btn.classList.remove("active"));
        if (name === "sunny") sunnyBtn.classList.add("active");
        if (name === "sunset") sunsetBtn.classList.add("active");
        if (name === "night") nightBtn.classList.add("active");
      }

      // 2-bone Inverse Kinematics solver (Law of Cosines)
      function solveIK(hx, hy, tx, ty, L1, L2) {
        const dx = tx - hx;
        const dy = ty - hy;
        const dRaw = Math.hypot(dx, dy);
        const d = Math.min(Math.max(dRaw, Math.abs(L1 - L2) + 0.001), L1 + L2 - 0.001);
        const phi = Math.atan2(dy, dx);
        const cosAlpha = (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d);
        const alpha = Math.acos(Math.min(1, Math.max(-1, cosAlpha)));
        // Bend knee forward (smaller angle in SVG coordinates where +x is right, +y is down)
        const kneeAngle = phi - alpha;
        return {
          kx: hx + L1 * Math.cos(kneeAngle),
          ky: hy + L1 * Math.sin(kneeAngle)
        };
      }

      function updatePedalElement(pedalGroup, cx, cy, px, py) {
        if (!pedalGroup) return;
        const line = pedalGroup.querySelector("line");
        const rect = pedalGroup.querySelector("rect");
        if (line) {
          line.setAttribute("x1", cx.toFixed(2));
          line.setAttribute("y1", cy.toFixed(2));
          line.setAttribute("x2", px.toFixed(2));
          line.setAttribute("y2", py.toFixed(2));
        }
        if (rect) {
          rect.setAttribute("x", (px - 14).toFixed(2));
          rect.setAttribute("y", (py - 4).toFixed(2));
        }
      }

      let speedFactor = 1.0;
      let isPlaying = true;
      let lastTimestamp = null;
      let simTime = 0;

      const BASE_RPM = 42;
      const BASE_KMH = 18.5;
      const CRANK_CX = 540;
      const CRANK_CY = 505;
      const CRANK_R = 30;
      const L1 = 54;
      const L2 = 50;

      function updateTelemetry() {
        const rpm = isPlaying ? Math.round(BASE_RPM * speedFactor) : 0;
        const kmh = isPlaying ? (BASE_KMH * speedFactor).toFixed(1) : "0.0";
        rpmValue.textContent = String(rpm);
        kmhValue.textContent = kmh;
      }

      function tick(timestamp) {
        if (lastTimestamp === null) lastTimestamp = timestamp;
        const dt = Math.min((timestamp - lastTimestamp) * 0.001, 0.1);
        lastTimestamp = timestamp;

        if (isPlaying) {
          simTime += dt * speedFactor;
        }

        // Crank angle (rad) based on cadence
        const omega = (BASE_RPM * 2 * Math.PI) / 60;
        const theta = simTime * omega;
        const wheelDeg = ((theta * 2.3 * 180) / Math.PI) % 360;

        // 1. Spin rear (430, 505) and front (650, 505) wheels around their hubs
        if (rearWheel) {
          rearWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 430 505)`);
        }
        if (frontWheel) {
          frontWheel.setAttribute("transform", `rotate(${wheelDeg.toFixed(2)} 650 505)`);
        }

        // 2. Compute front & back pedal positions on the crank circle
        const frontAngle = theta;
        const backAngle = theta + Math.PI;
        const pFrontX = CRANK_CX + CRANK_R * Math.cos(frontAngle);
        const pFrontY = CRANK_CY + CRANK_R * Math.sin(frontAngle);
        const pBackX = CRANK_CX + CRANK_R * Math.cos(backAngle);
        const pBackY = CRANK_CY + CRANK_R * Math.sin(backAngle);

        updatePedalElement(pedalFront, CRANK_CX, CRANK_CY, pFrontX, pFrontY);
        updatePedalElement(pedalBack, CRANK_CX, CRANK_CY, pBackX, pBackY);

        // 3. Body rhythmic bobbing at 2x cadence
        const bob = Math.sin(theta * 2) * 3.2;
        const pitch = Math.cos(theta * 2) * 1.1;

        // 4. Solve 2-bone IK for both pelican legs tracking the pedals
        const hipBackX = 485;
        const hipBackY = 458 + bob;
        const kneeBack = solveIK(hipBackX, hipBackY, pBackX, pBackY, L1, L2);
        if (legBackUpper) {
          legBackUpper.setAttribute("d", `M${hipBackX.toFixed(2)} ${hipBackY.toFixed(2)} L${kneeBack.kx.toFixed(2)} ${kneeBack.ky.toFixed(2)}`);
        }
        if (legBackLower) {
          legBackLower.setAttribute("d", `M${kneeBack.kx.toFixed(2)} ${kneeBack.ky.toFixed(2)} L${pBackX.toFixed(2)} ${pBackY.toFixed(2)}`);
        }
        if (footBack) {
          const footTiltBack = Math.sin(backAngle) * 10;
          footBack.setAttribute("transform", `translate(${pBackX.toFixed(2)}, ${pBackY.toFixed(2)}) rotate(${footTiltBack.toFixed(2)})`);
        }

        const hipFrontX = 515;
        const hipFrontY = 458 + bob;
        const kneeFront = solveIK(hipFrontX, hipFrontY, pFrontX, pFrontY, L1, L2);
        if (legFrontUpper) {
          legFrontUpper.setAttribute("d", `M${hipFrontX.toFixed(2)} ${hipFrontY.toFixed(2)} L${kneeFront.kx.toFixed(2)} ${kneeFront.ky.toFixed(2)}`);
        }
        if (legFrontLower) {
          legFrontLower.setAttribute("d", `M${kneeFront.kx.toFixed(2)} ${kneeFront.ky.toFixed(2)} L${pFrontX.toFixed(2)} ${pFrontY.toFixed(2)}`);
        }
        if (footFront) {
          const footTiltFront = Math.sin(frontAngle) * 10;
          footFront.setAttribute("transform", `translate(${pFrontX.toFixed(2)}, ${pFrontY.toFixed(2)}) rotate(${footTiltFront.toFixed(2)})`);
        }

        // 5. Animate pelican upper anatomy (body, wing grip, gular throat pouch, tail, blinking eye)
        const upperTransform = `translate(0, ${bob.toFixed(2)}) rotate(${pitch.toFixed(2)} 480 430)`;
        if (bodyGroup) bodyGroup.setAttribute("transform", upperTransform);
        if (headGroup) headGroup.setAttribute("transform", upperTransform);
        if (beakGroup) beakGroup.setAttribute("transform", upperTransform);
        if (eyeGroup) eyeGroup.setAttribute("transform", upperTransform);

        if (tailFeathers) {
          const tailWag = Math.sin(theta * 2 - 0.6) * 4.5;
          tailFeathers.setAttribute("transform", `translate(0, ${bob.toFixed(2)}) rotate(${tailWag.toFixed(2)} 365 418)`);
        }

        if (wingGroup) {
          // Keep handlebar grip anchored around (660, 365) while fluttering shoulder
          const wingFlutter = Math.sin(theta * 2) * 1.8;
          wingGroup.setAttribute("transform", `translate(0, ${(bob * 0.4).toFixed(2)}) rotate(${wingFlutter.toFixed(2)} 660 365)`);
        }

        if (pouch) {
          // Secondary elastic bounce on the signature gular throat pouch
          const pouchBounce = Math.sin(theta * 2 - 0.85) * 4.2;
          const pouchScaleY = 1 + Math.sin(theta * 2 - 0.85) * 0.045;
          pouch.setAttribute(
            "transform",
            `translate(0, ${(bob + pouchBounce).toFixed(2)}) translate(625, 395) scale(1, ${pouchScaleY.toFixed(3)}) translate(-625, -395)`
          );
        }

        if (eyeLid) {
          const blinkPhase = simTime % 4.2;
          const isBlinking = blinkPhase > 4.02;
          eyeLid.setAttribute("transform", isBlinking ? "translate(0, 6)" : "translate(0, 0)");
        }

        // 6. Scrolling road dashes & parallax clouds
        if (roadDashes) {
          const dashOffset = -((simTime * 220) % 110);
          roadDashes.setAttribute("transform", `translate(${dashOffset.toFixed(2)}, 0)`);
        }
        if (clouds) {
          const cloudOffset = -((simTime * 18) % 240);
          clouds.setAttribute("transform", `translate(${cloudOffset.toFixed(2)}, 0)`);
        }

        window.requestAnimationFrame(tick);
      }

      speedSlider.addEventListener("input", () => {
        speedFactor = parseFloat(speedSlider.value);
        speedValue.textContent = `${speedFactor.toFixed(1)}x`;
        updateTelemetry();
      });

      playPauseBtn.addEventListener("click", () => {
        isPlaying = !isPlaying;
        playPauseBtn.textContent = isPlaying ? "Pause" : "Play";
        updateTelemetry();
      });

      sunnyBtn.addEventListener("click", () => applyTheme("sunny"));
      sunsetBtn.addEventListener("click", () => applyTheme("sunset"));
      nightBtn.addEventListener("click", () => applyTheme("night"));

      applyTheme("sunny");
      updateTelemetry();
      window.requestAnimationFrame(tick);
    })();
  </script>
